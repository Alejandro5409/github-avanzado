name: CD - Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bump-version:
    name: Actualizar versión en README
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Incrementar versión de la aplicación
        shell: bash
        run: |
          sed -i 's/AppVersion-0/AppVersion-1/' README.md
          grep -F "AppVersion-1" README.md

      - name: Informar de la protección de rama
        shell: bash
        run: |
          echo "El README se ha actualizado dentro del job."
          echo "La persistencia en main se realizará mediante Pull Request, porque la rama está protegida."

  validate-prod:
    name: Validar token de producción
    runs-on: [self-hosted, Windows, X64]
    needs: bump-version

    steps:
      - name: Comparar PROD_TOKEN con LOCAL_PROD_TOKEN
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:PROD_TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "PROD_TOKEN y LOCAL_PROD_TOKEN coinciden."
          }
          else {
            Write-Error "PROD_TOKEN y LOCAL_PROD_TOKEN no coinciden."
            exit 1
          }
